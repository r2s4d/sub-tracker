; Настройки для UI-тестов (браузер Playwright + отчёт Allure).
; Обычные тесты приложения запускаются штатно: python manage.py test
[pytest]
DJANGO_SETTINGS_MODULE = config.settings
testpaths = uitests
; Файлы UI-тестов называются ui_*.py, поэтому manage.py test их не подхватывает:
; у него шаблон поиска test*.py. Два набора тестов не мешают друг другу.
python_files = ui_*.py
addopts = --browser chromium -p no:randomly
