# Коннектор Telegram MCP (репозиторий r2s4d/telegram-mcp, контейнер telegram-mcp).
# Отдельный хост: существующие server-блоки (default.conf/https.conf) и opozdal.conf
# не затрагиваются, блок реагирует только на Host: mcp.151-243-224-253.sslip.io.
# Шаг A: пока нет сертификата, отвечает только проверка Let's Encrypt.
server {
    listen 80;
    server_name mcp.151-243-224-253.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
