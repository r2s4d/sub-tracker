# Коннектор Telegram MCP (репозиторий r2s4d/telegram-mcp, контейнер telegram-mcp).
# Отдельный хост: существующие server-блоки (default.conf/https.conf) и opozdal.conf
# не затрагиваются, блоки реагируют только на Host: mcp.151-243-224-253.sslip.io.
# Сертификат tgmcp выпущен через certbot-контейнер этого стека и продлевается им же.
server {
    listen 80;
    server_name mcp.151-243-224-253.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mcp.151-243-224-253.sslip.io;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/tgmcp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tgmcp/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Встроенный DNS docker: адрес контейнера ищется при запросе, поэтому nginx
    # стартует и перезагружается, даже если telegram-mcp остановлен (будет 502).
    # Резолвер задан только здесь, на остальные сайты он не влияет.
    resolver 127.0.0.11 valid=30s;

    location / {
        set $mcp_upstream http://telegram-mcp:8000;
        proxy_pass $mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
