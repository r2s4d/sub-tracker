# nginx перед gunicorn: раздаёт статику сам (быстрее, чем через Python),
# остальные запросы передаёт в Django и ограничивает частоту попыток входа.

# Защита от перебора паролей: не больше 10 запросов в минуту с одного IP
# на страницы входа и регистрации. 10 МБ памяти хватает примерно на 160 тысяч адресов.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

upstream django {
    server web:8000;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 1m;
    server_tokens off;

    # Проверка домена для сертификата Let's Encrypt (подключается вместе с HTTPS)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /app/staticfiles/;
        # Имена файлов без хеша, поэтому браузер переспрашивает сервер (ответ 304 без тела),
        # и после деплоя новые стили видны сразу.
        add_header Cache-Control "no-cache";
    }

    # Запас в 10 запросов: человек, который ошибся паролем пару раз, ограничения не заметит,
    # и несколько человек за одним адресом (например, в аудитории на защите) тоже.
    location ~ ^/(accounts/(login|signup)|admin/login)/ {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location / {
        include /etc/nginx/conf.d/proxy.inc;
    }
}
