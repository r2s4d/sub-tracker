# Отдельный хост под требование "1 л/р + 2 л/р + 6 л/р": opozdal.ru проксируется
# на Apache лабы 2 (контейнер apache-lab-apache-1, отдельный docker-compose проект).
# Файл независимый: существующие server-блоки боевого сайта (default.conf/https.conf)
# не меняются, этот блок подключается автоматически через /etc/nginx/conf.d/*.conf
# и реагирует только на запросы с Host: opozdal.ru — остального трафика не касается.
server {
    listen 80;
    server_name opozdal.ru;

    location / {
        proxy_pass http://apache-lab-apache-1:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
