# Вариант default.conf для режима с HTTPS (подключается docker-compose.https.yml).
# Отличия от обычного: есть сервер на 443 с сертификатом, а весь http,
# кроме проверки Let's Encrypt, перенаправляется на https.

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

upstream django {
    server web:8000;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    client_max_body_size 1m;
    server_tokens off;

    # Имя сертификата задаётся при выпуске флагом --cert-name site,
    # поэтому путь не зависит от адреса сайта.
    ssl_certificate /etc/letsencrypt/live/site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;

    location /static/ {
        alias /app/staticfiles/;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(accounts/(login|signup)|admin/login)/ {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location / {
        include /etc/nginx/conf.d/proxy.inc;
    }
}
